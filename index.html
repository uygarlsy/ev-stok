<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ev Stok Takibi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F7F6F2;color:#1C1C1A;min-height:100vh}
.app{max-width:780px;margin:0 auto;padding:1.5rem 1rem}

.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;gap:1rem}
.header-text h1{font-size:20px;font-weight:600;color:#1C1C1A;letter-spacing:-0.01em}
.header-text p{font-size:13px;color:#888780;margin-top:3px}
.add-btn{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;border:none;background:#1C1C1A;color:#F7F6F2;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
.add-btn:hover{background:#3a3a36}

.scard.warn .num{color:#854F0B}
.scard.danger .num{color:#A32D2D}

.tabs{display:flex;gap:6px;margin-bottom:0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid #D3D1C7;background:#fff;color:#5F5E5A}
.tab.active{background:#1C1C1A;color:#F7F6F2;border-color:transparent}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px;margin-bottom:2rem}
.card{background:#fff;border:1px solid #E8E7E2;border-radius:12px;padding:0.75rem;cursor:pointer;transition:border-color 0.15s}
.card:hover{border-color:#B4B2A9}
.card-emoji{font-size:18px;margin-bottom:5px}
.card-name{font-size:12px;font-weight:600;color:#1C1C1A;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-cat{font-size:10px;color:#888780;margin-bottom:6px}

.card-qty-bar{margin:5px 0 3px}
.qty-bar-bg{height:4px;background:#F1EFE8;border-radius:3px;overflow:hidden;margin-top:3px}
.qty-bar-fill{height:100%;border-radius:3px;transition:width 0.3s}

.card-stats{font-size:10px;color:#888780;margin-top:4px}
.card-stats span{color:#1C1C1A;font-weight:500}

.badge{display:inline-block;font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;margin-bottom:4px;letter-spacing:0.02em}
.badge-ok{background:#EAF3DE;color:#3B6D11}
.badge-warn{background:#FAEEDA;color:#854F0B}
.badge-danger{background:#FCEBEB;color:#A32D2D}
.badge-nodata{background:#F1EFE8;color:#5F5E5A}

.empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:#B4B2A9;font-size:14px}
.empty-icon{font-size:40px;margin-bottom:12px}

.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:#B4B2A9}
.sync-dot.ok{background:#3B6D11}
.sync-dot.err{background:#A32D2D}
.sync-dot.loading{background:#854F0B;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;border:1px solid #E8E7E2;width:100%;max-width:420px;padding:1.5rem;display:flex;flex-direction:column;max-height:calc(100vh - 2rem);overflow:hidden}
.modal-body{flex:1;overflow-y:auto;overflow-x:hidden}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.75rem}
.modal-header h2{font-size:16px;font-weight:600;color:#1C1C1A}
.close-btn{background:none;border:none;font-size:22px;color:#888780;cursor:pointer;line-height:1;padding:0 2px}
.close-btn:hover{color:#1C1C1A}

.form-group{margin-bottom:0.85rem}
.form-group label{font-size:12px;font-weight:500;color:#5F5E5A;display:block;margin-bottom:5px}
.form-group input,.form-group select{width:100%;padding:9px 12px;font-size:14px;border:1px solid #D3D1C7;border-radius:9px;background:#fff;color:#1C1C1A;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#888780}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.modal-actions{display:flex;gap:8px;margin-top:1.25rem}
.btn{padding:9px 18px;font-size:13px;font-weight:500;border-radius:9px;cursor:pointer;border:1px solid #D3D1C7;background:#fff;color:#5F5E5A}
.btn:hover{background:#F7F6F2}
.btn.primary{background:#1C1C1A;color:#fff;border-color:transparent;flex:1}
.btn.primary:hover{background:#3a3a36}
.btn.danger{color:#A32D2D;border-color:#F7C1C1}
.btn.danger:hover{background:#FCEBEB}

.info-box{background:#F7F6F2;border-radius:10px;padding:0.6rem 0.85rem;margin-bottom:0.6rem;font-size:12px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.info-row:not(:last-child){border-bottom:1px solid #E8E7E2}
.info-row .lbl{color:#888780}
.info-row .val{font-weight:500;color:#1C1C1A}

.section-title{font-size:10px;font-weight:600;color:#B4B2A9;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:0.5rem;margin-top:0.75rem}

.record-area{background:#F7F6F2;border-radius:10px;padding:1rem;margin-top:0.75rem}

.log-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12px;border-bottom:1px solid #F1EFE8}
.log-item:last-child{border-bottom:none}
.log-date{color:#5F5E5A}
.log-qty{font-weight:600;color:#1C1C1A}
.log-del{color:#D3D1C7;cursor:pointer;padding:0 4px;font-size:16px;line-height:1}
.log-del:hover{color:#A32D2D}

.purchase-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12px;border-bottom:1px solid #F1EFE8}
.purchase-item:last-child{border-bottom:none}

.detail-tabs{display:flex;gap:6px;margin-top:0.6rem;margin-bottom:0.5rem}
.detail-tab{padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #D3D1C7;background:#fff;color:#5F5E5A;font-weight:500}
.detail-tab.active{background:#1C1C1A;color:#fff;border-color:transparent}
.detail-panel{display:none}
.detail-panel.active{display:block}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .form-row{grid-template-columns:1fr}
}
input[type="date"] {
  -webkit-appearance: none;
  appearance: none;
  min-width: 0 !important;
  width: 100% !important;
}

/* Liste görünümü */
.grid.list-view {
  display:flex;flex-direction:column;gap:5px;
  grid-template-columns:unset;
}
.grid.list-view .card {
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:10px;
}
.grid.list-view .card-emoji { font-size:18px;margin:0;flex-shrink:0 }
.grid.list-view .card-name  { font-size:13px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
.grid.list-view .card-cat   { display:none }
.grid.list-view .badge      { display:none }
.grid.list-view .card-qty-bar { display:none }
.grid.list-view .card-stats { display:none }
.grid.list-view .list-meta  { display:flex;align-items:center;gap:8px;flex-shrink:0 }
.grid.list-view .list-stock { font-size:12px;font-weight:600;color:#1C1C1A;white-space:nowrap }
.grid.list-view .list-days  { font-size:11px;color:#888780;white-space:nowrap }
.grid.list-view .list-badge { font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap }
/* Normal görünümde liste meta gizli */
.list-meta { display:none }

/* Header inline stats */
.scard-inline{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.num-inline{font-size:18px;font-weight:600;color:#1C1C1A}
.scard-inline.warn .num-inline{color:#854F0B}
.scard-inline.danger .num-inline{color:#A32D2D}
.lbl-inline{font-size:11px;color:#888780}



/* Kategori chip'leri */
.cat-filters{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.cat-filters::-webkit-scrollbar{display:none}
.cat-chip{padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #D3D1C7;background:#fff;color:#5F5E5A;white-space:nowrap}
.cat-chip.active{background:#F7F6F2;border-color:#888780;color:#1C1C1A;font-weight:500}


</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-text">
      <h1>🏠 Ev Stok Takibi</h1>
      <p><span class="sync-dot loading" id="sync-dot"></span><span id="sync-text">Bağlanıyor...</span></p>
    </div>
    <button class="add-btn" onclick="openAdd()">＋ Ürün Ekle</button>
  </div>
  <div style="display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto;align-items:center;background:#fff;border:1px solid #E8E7E2;border-radius:10px;padding:8px 14px;margin-bottom:1rem">
    <div style="display:flex;gap:5px;align-items:baseline;justify-content:center"><span class="num-inline" id="s-total">—</span><span class="lbl-inline">ürün</span></div>
    <div style="width:1px;background:#E8E7E2;height:18px"></div>
    <div style="display:flex;gap:5px;align-items:baseline;justify-content:center"><span class="num-inline" style="color:#854F0B" id="s-warn">—</span><span class="lbl-inline">yakında bitecek</span></div>
    <div style="width:1px;background:#E8E7E2;height:18px"></div>
    <div style="display:flex;gap:5px;align-items:baseline;justify-content:center"><span class="num-inline" style="color:#A32D2D" id="s-out">—</span><span class="lbl-inline">bitti</span></div>
    <div style="width:1px;background:#E8E7E2;height:18px;margin-left:10px"></div>
    <button onclick="toggleListView(this)" id="view-btn" style="background:none;border:none;cursor:pointer;font-size:16px;padding:2px 6px;color:#888780;margin-left:4px" title="Görünümü değiştir">⊞</button>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:0.75rem;overflow:hidden">
    <div class="tabs" style="flex:1;min-width:0">
      <button class="tab active" onclick="setTab('all',this)">Tümü</button>
      <button class="tab" onclick="setTab('danger',this)">⚠ Bitti</button>
      <button class="tab" onclick="setTab('warn',this)">⚡ Yakında Bitecek</button>
      <button class="tab" onclick="setTab('ok',this)">✓ Yeterli</button>
    </div>

  </div>
  <div class="cat-filters" id="cat-filters"></div>

  <div class="grid" id="product-grid">
    <div class="empty" style="grid-column:1/-1"><div class="empty-icon">⏳</div>Yükleniyor...</div>
  </div>
</div>

<div class="modal-bg" id="modal-bg" style="display:none">
  <div class="modal" id="modal-content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyA3JzApShar7jjR13j_z69-E7njxfID6ew",
  authDomain: "ev-stok-e0e64.firebaseapp.com",
  databaseURL: "https://ev-stok-e0e64-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ev-stok-e0e64",
  storageBucket: "ev-stok-e0e64.firebasestorage.app",
  messagingSenderId: "462947130561",
  appId: "1:462947130561:web:96e2a97c72159cc155c840"
});
const db = firebase.database();
const ref = db.ref('products2'); // yeni model, temiz başlangıç

let products = {};
let currentTab = 'all';

function sync(state, text) {
  document.getElementById('sync-dot').className = 'sync-dot ' + state;
  document.getElementById('sync-text').textContent = text;
}

ref.on('value', snap => {
  products = snap.val() || {};
  sync('ok', 'Senkronize');
  renderCatFilters();
  renderGrid();
}, () => sync('err', 'Bağlantı hatası'));

// ── Sabitler ──────────────────────────────────────────────────
const CATS = {
  'Yiyecek & İçecek':'🥫','Temizlik':'🧹',
  'Mutfak':'🍳','Kişisel Bakım':'🧴','Kağıt Ürünleri':'🧻','Diğer':'📦'
};
const UNITS = ['adet', 'kg', 'L'];

// ── Yardımcılar ───────────────────────────────────────────────
function today() { return new Date().toISOString().split('T')[0]; }
function uid()   { return ref.push().key; }

function parseNum(v) {
  if (!v && v !== 0) return null;
  const n = parseFloat(String(v).replace(',', '.'));
  return isNaN(n) ? null : n;
}

function formatDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${day}.${m}.${y}`;
}

function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}

// ── Hesaplama motoru ──────────────────────────────────────────
// Her ürünün yapısı:
//   purchases: { key: { date, qty } }   — alımlar
//   consumption: { key: { date, qty } } — tüketimler
//   unit, category, name

// Stok hesabı: toplam alınan - toplam tüketilen
function calcStock(p) {
  const bought = p.purchases
    ? Object.values(p.purchases).reduce((s, x) => s + (x.qty || 0), 0)
    : 0;
  const used = p.consumption
    ? Object.values(p.consumption).reduce((s, x) => s + (x.qty || 0), 0)
    : 0;
  return Math.max(0, bought - used);
}

// Günlük ortalama tüketim hızı (birim/gün) — tüketim kayıtlarından
function calcDailyRate(p) {
  if (!p.consumption) return null;
  const logs = Object.values(p.consumption).sort((a, b) => a.date > b.date ? 1 : -1);
  if (logs.length === 0) return null;

  // İlk alım tarihi
  const firstPurchase = p.purchases
    ? Object.values(p.purchases).map(x => x.date).sort()[0]
    : null;
  if (!firstPurchase) return null;

  const lastLog = logs[logs.length - 1].date;
  const totalDays = daysBetween(firstPurchase, lastLog);
  if (totalDays <= 0) return null;

  const totalUsed = logs.reduce((s, x) => s + (x.qty || 0), 0);
  return totalUsed / totalDays; // birim/gün
}

// Kalan gün tahmini
function calcDaysLeft(p) {
  const stock = calcStock(p);
  const rate = calcDailyRate(p);
  if (rate === null || rate <= 0) return null;
  return Math.round(stock / rate);
}

// Tahmini bitiş tarihi
function calcEndDate(p) {
  const dl = calcDaysLeft(p);
  if (dl === null) return null;
  const d = new Date();
  d.setDate(d.getDate() + dl);
  return formatDate(d.toISOString().split('T')[0]);
}

function getStatus(p) {
  const stock = calcStock(p);
  if (stock <= 0) return 'danger';
  const dl = calcDaysLeft(p);
  if (dl === null) return 'nodata';
  if (dl <= 7) return 'warn';
  return 'ok';
}

// ── Kart render ───────────────────────────────────────────────
function badgeHtml(status) {
  return {
    ok:     '<span class="badge badge-ok">✓ Yeterli</span>',
    warn:   '<span class="badge badge-warn">⚡ Yakında Bitecek</span>',
    danger: '<span class="badge badge-danger">⚠ Bitti / Eksik</span>',
    nodata: '<span class="badge badge-nodata">📊 Veri bekleniyor</span>'
  }[status] || '';
}

function barColor(pct) {
  if (pct > 0.4) return '#3B6D11';
  if (pct > 0.15) return '#854F0B';
  return '#A32D2D';
}

function renderGrid() {
  const grid = document.getElementById('product-grid');
  let list = Object.entries(products).map(([id, p]) => ({ ...p, id }));

  const order = { danger: 0, warn: 1, nodata: 2, ok: 3 };
  list.sort((a, b) => (order[getStatus(a)] || 0) - (order[getStatus(b)] || 0));

  if (currentTab === 'danger') list = list.filter(p => getStatus(p) === 'danger');
  else if (currentTab === 'warn') list = list.filter(p => getStatus(p) === 'warn');
  else if (currentTab === 'ok') list = list.filter(p => getStatus(p) === 'ok');

  if (currentCat !== 'all') list = list.filter(p => p.category === currentCat);

  updateSummary();

  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📦</div>${
      Object.keys(products).length ? 'Bu filtrede ürün yok.' : 'Henüz ürün eklenmedi.<br><small>"Ürün Ekle" ile başlayın.</small>'
    }</div>`;
    return;
  }

  grid.innerHTML = list.map(p => {
    const status = getStatus(p);
    const stock = calcStock(p);
    const dl = calcDaysLeft(p);
    const rate = calcDailyRate(p);

    // Stok için maksimum referans: son alım miktarı
    const lastPurchaseQty = p.purchases
      ? Object.values(p.purchases).sort((a,b) => b.date > a.date ? 1 : -1)[0]?.qty || 1
      : 1;
    const pct = Math.min(1, stock / Math.max(stock, lastPurchaseQty));

    const stockText = p.unit ? `${stock} ${p.unit}` : `${stock} adet`;
    const endDate = calcEndDate(p);
    const daysText = dl !== null ? (dl <= 0 ? 'Bitti!' : endDate) : '—';
    const rateText = rate !== null
      ? `${rate < 1 ? (1/rate).toFixed(1) + ' günde 1' : rate.toFixed(2) + '/gün'} ${p.unit || 'adet'}`
      : 'veri yok';

    return `<div class="card" onclick="openDetail('${p.id}')">
      <div class="card-emoji">${CATS[p.category]||'📦'}</div>
      <div class="card-name" title="${p.name}">${p.name}</div>
      <div class="card-cat">${p.category}</div>
      ${badgeHtml(status)}
      <div class="card-qty-bar">
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span style="color:#888780">Stok</span>
          <span style="font-weight:600;color:#1C1C1A">${stockText}</span>
        </div>
        <div class="qty-bar-bg"><div class="qty-bar-fill" style="width:${(pct*100).toFixed(0)}%;background:${barColor(pct)}"></div></div>
      </div>
      <div class="card-stats">Tahmini: <span>${daysText}</span></div>
      <div class="card-stats">Hız: <span>${rateText}</span></div>
      <div class="list-meta">
        <span class="list-stock">${stockText}</span>
        <span class="list-days">${daysText}</span>
        <span class="list-badge ${status==='ok'?'badge-ok':status==='warn'?'badge-warn':status==='danger'?'badge-danger':'badge-nodata'}">${status==='ok'?'✓':status==='warn'?'⚡':status==='danger'?'⚠':'?'}</span>
      </div>
    </div>`;
  }).join('');
}

function updateSummary() {
  const all = Object.values(products);
  document.getElementById('s-total').textContent = all.length;
  document.getElementById('s-warn').textContent = all.filter(p => getStatus(p) === 'warn').length;
  document.getElementById('s-out').textContent = all.filter(p => getStatus(p) === 'danger').length;
}

let currentCat = 'all';
function setTab(t, el) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function setCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function renderCatFilters() {
  const container = document.getElementById('cat-filters');
  if (!container) return;
  const cats = ['all', ...Object.keys(CATS)];
  container.innerHTML = cats.map(c => {
    const label = c === 'all' ? 'Tümü' : (CATS[c] + ' ' + c);
    const active = c === currentCat ? ' active' : '';
    return `<button class="cat-chip${active}" onclick="setCat('${c}',this)">${label}</button>`;
  }).join('');
}



// ── Ürün Ekle ────────────────────────────────────────────────
function openAdd() {
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <h2>Yeni Ürün Ekle</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
    <div class="form-group">
      <label>Ürün adı</label>
      <input id="f-name" placeholder="Örn: Çay, Deterjan, Tuvalet Kağıdı…" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Kategori</label>
        <select id="f-cat">${Object.keys(CATS).map(c=>`<option>${c}</option>`).join('')}</select>
      </div>
      <div class="form-group">
        <label>Birim</label>
        <select id="f-unit">
          <option value="">— birimsiz —</option>
          ${UNITS.map(u=>`<option>${u}</option>`).join('')}
        </select>
      </div>
    </div>
    <div style="background:#F7F6F2;border-radius:10px;padding:1rem;margin-bottom:0.5rem">
      <div style="font-size:12px;font-weight:500;color:#5F5E5A;margin-bottom:10px">İlk alım <span style="color:#B4B2A9;font-weight:400">(opsiyonel)</span></div>
      <div class="form-row">
        <div class="form-group" style="margin-bottom:0">
          <label>Tarih</label>
          <input id="f-date" type="date" value="${today()}" />
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Miktar</label>
          <input id="f-qty" type="number" min="0.1" step="0.1" value="1" />
        </div>
      </div>
    </div>
    <div style="font-size:12px;color:#888780;margin-bottom:1rem">Stokta yoksa tarihi ve miktarı boş bırakabilirsin.</div>
    </div>
    <div class="modal-actions" style="padding-top:0.75rem;border-top:1px solid #E8E7E2;flex-shrink:0">
      <button class="btn" onclick="closeModal()">İptal</button>
      <button class="btn primary" onclick="addProduct()">Kaydet</button>
    </div>`;
  document.getElementById('modal-bg').style.display = 'flex'; document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('f-name').focus(), 50);
}

function addProduct() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Lütfen ürün adı girin.'); return; }
  try {
    const unit = document.getElementById('f-unit').value || null;
    const date = document.getElementById('f-date').value;
    const qty = parseNum(document.getElementById('f-qty').value);
    const category = document.getElementById('f-cat').value;

    // Aynı isim + aynı birim → mevcut karta alım ekle
    const nameLower = name.toLowerCase();
    const existing = Object.values(products).find(p =>
      p.name.toLowerCase() === nameLower && (p.unit || null) === unit
    );

    if (existing) {
      if (date && qty) {
        const pk = ref.child(existing.id).child('purchases').push().key;
        sync('loading', 'Alım ekleniyor...');
        db.ref(`products2/${existing.id}/purchases/${pk}`).set({ date, qty })
          .then(() => closeModal()).catch(e => alert('Hata: ' + e.message));
      } else {
        alert(`"${existing.name}" zaten listede var. Alım miktarı girmeden eklenemez.`);
      }
      return;
    }

    const id = uid();
    const p = { id, name, category, unit: unit || null, purchases: {}, consumption: {} };
    if (date && qty) {
      const pk = ref.child(id).child('purchases').push().key;
      p.purchases[pk] = { date, qty };
    }
    sync('loading', 'Kaydediliyor...');
    ref.child(id).set(p).then(() => closeModal()).catch(e => alert('Hata: ' + e.message));
  } catch(e) { alert('Hata: ' + e.message); }
}

// ── Ürün Detay ───────────────────────────────────────────────
function openDetail(id) {
  const p = { ...products[id], id };
  if (!p.name) return;

  const status = getStatus(p);
  const stock = calcStock(p);
  const dl = calcDaysLeft(p);
  const rate = calcDailyRate(p);
  const unit = p.unit || 'adet';

  const stockText = `${stock} ${unit}`;
  const endDate = calcEndDate(p);
  const daysText = dl !== null ? (dl <= 0 ? 'Tükenmiş' : endDate) : '—';
  const rateText = rate !== null
    ? `${rate < 1 ? (1/rate).toFixed(1) + ' günde 1 ' + unit : rate.toFixed(2) + ' ' + unit + '/gün'}`
    : '—';

  // Alım geçmişi
  const purchases = p.purchases ? Object.entries(p.purchases).sort((a,b) => b[1].date > a[1].date ? 1:-1) : [];
  const purchaseHtml = purchases.length
    ? purchases.map(([k, x]) => `
        <div class="purchase-item">
          <span style="color:#5F5E5A">🛒 ${formatDate(x.date)}</span>
          <span style="font-weight:600">+${x.qty} ${unit}</span>
          <span class="log-del" onclick="deletePurchase('${id}','${k}')">×</span>
        </div>`).join('')
    : '<div style="font-size:12px;color:#B4B2A9;padding:4px 0">Alım kaydı yok</div>';

  // Tüketim günlüğü
  const logs = p.consumption ? Object.entries(p.consumption).sort((a,b) => b[1].date > a[1].date ? 1:-1) : [];
  const logHtml = logs.length
    ? logs.map(([k, x]) => `
        <div class="log-item">
          <span class="log-date">${formatDate(x.date)}</span>
          <span class="log-qty">−${x.qty} ${unit}</span>
          <span class="log-del" onclick="deleteLog('${id}','${k}')">×</span>
        </div>`).join('')
    : '<div style="font-size:12px;color:#B4B2A9;padding:4px 0">Tüketim kaydı yok</div>';

  // Birleşik geçmiş: alımlar + tüketimler, tarihe göre sıralı
  const allEvents = [
    ...purchases.map(([k, x]) => ({ date: x.date, qty: x.qty, type: 'buy', key: k })),
    ...logs.map(([k, x]) => ({ date: x.date, qty: x.qty, type: 'use', key: k }))
  ].sort((a, b) => b.date > a.date ? 1 : -1);

  const combinedHistoryHtml = allEvents.length
    ? allEvents.map(e => e.type === 'buy'
        ? `<div class="log-item">
            <span class="log-date">🛒 ${formatDate(e.date)}</span>
            <span class="log-qty" style="color:#3B6D11">+${e.qty} ${unit}</span>
            <span class="log-del" onclick="deletePurchase('${id}','${e.key}')">×</span>
           </div>`
        : `<div class="log-item">
            <span class="log-date">📉 ${formatDate(e.date)}</span>
            <span class="log-qty" style="color:#A32D2D">−${e.qty} ${unit}</span>
            <span class="log-del" onclick="deleteLog('${id}','${e.key}')">×</span>
           </div>`
      ).join('')
    : '<div style="font-size:12px;color:#B4B2A9;padding:8px 0">Henüz kayıt yok</div>';

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:28px">${CATS[p.category]||'📦'}</span>
        <div><h2>${p.name}</h2><div style="font-size:12px;color:#888780">${p.category}${p.unit ? ' · ' + p.unit : ''}</div></div>
      </div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
    ${badgeHtml(status)}

    <div class="info-box">
      <div class="info-row"><span class="lbl">Mevcut stok</span><span class="val">${stockText}</span></div>
      <div class="info-row"><span class="lbl">Tahmini bitiş</span><span class="val">${daysText}</span></div>
      <div class="info-row"><span class="lbl">Tüketim hızı</span><span class="val">${rateText}</span></div>
    </div>

    <div class="detail-tabs">
      <button class="detail-tab active" id="dtab-main" onclick="switchDetailTab2('main',this)">📋 Özet</button>
      <button class="detail-tab" id="dtab-history" onclick="switchDetailTab2('history',this)">📅 Geçmiş</button>
    </div>
    <div id="dpanel-main" class="detail-panel active">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;overflow:hidden">

        <div style="background:#F7F6F2;border-radius:10px;padding:10px">
          <div style="font-size:10px;font-weight:600;color:#A32D2D;letter-spacing:0.05em;margin-bottom:8px">TÜKETİM</div>
          <div style="margin-bottom:8px">
            <div style="font-size:10px;color:#5F5E5A;margin-bottom:3px">Tarih</div>
            <input id="c-date" type="date" value="${today()}" style="width:100%;padding:4px 4px;font-size:11px;border:1px solid #D3D1C7;border-radius:7px;background:#fff;color:#1C1C1A;outline:none;margin-bottom:6px;overflow:hidden;min-width:0"/>
            <div style="font-size:10px;color:#5F5E5A;margin-bottom:3px">Miktar</div>
            <input id="c-qty" type="number" min="0.1" step="0.1" value="1" style="width:100%;padding:4px 6px;font-size:12px;border:1px solid #D3D1C7;border-radius:7px;background:#fff;color:#1C1C1A;outline:none"/>
          </div>
          <button onclick="addConsumption('${id}')" style="width:100%;padding:7px;font-size:12px;font-weight:600;border:none;border-radius:7px;background:#A32D2D;color:#fff;cursor:pointer">− Tüketim</button>
        </div>

        <div style="background:#F7F6F2;border-radius:10px;padding:10px">
          <div style="font-size:10px;font-weight:600;color:#3B6D11;letter-spacing:0.05em;margin-bottom:8px">ALIM</div>
          <div style="margin-bottom:8px">
            <div style="font-size:10px;color:#5F5E5A;margin-bottom:3px">Tarih</div>
            <input id="b-date" type="date" value="${today()}" style="width:100%;padding:4px 4px;font-size:11px;border:1px solid #D3D1C7;border-radius:7px;background:#fff;color:#1C1C1A;outline:none;margin-bottom:6px;overflow:hidden;min-width:0"/>
            <div style="font-size:10px;color:#5F5E5A;margin-bottom:3px">Miktar</div>
            <input id="b-qty" type="number" min="0.1" step="0.1" value="1" style="width:100%;padding:4px 6px;font-size:12px;border:1px solid #D3D1C7;border-radius:7px;background:#fff;color:#1C1C1A;outline:none"/>
          </div>
          <button onclick="addPurchase('${id}')" style="width:100%;padding:7px;font-size:12px;font-weight:600;border:none;border-radius:7px;background:#3B6D11;color:#fff;cursor:pointer">+ Alım</button>
        </div>

      </div>
    </div>
    <div id="dpanel-history" class="detail-panel">
      ${combinedHistoryHtml}
    </div>

    </div>
    <div class="modal-actions" style="margin-top:1rem;padding-top:0.75rem;border-top:1px solid #E8E7E2;flex-shrink:0">
      <button class="btn danger" onclick="deleteProduct('${id}')">Sil</button>
      <button class="btn" onclick="openEdit('${id}')">Düzenle</button>
      <button class="btn primary" onclick="closeModal()">Kapat</button>
    </div>`;
  document.getElementById('modal-bg').style.display = 'flex'; document.body.style.overflow = 'hidden';
}

function addConsumption(id) {
  const date = document.getElementById('c-date').value;
  const qty = parseNum(document.getElementById('c-qty').value);
  if (!date || !qty) { alert('Tarih ve miktar gerekli.'); return; }
  const k = ref.child(id).child('consumption').push().key;
  sync('loading', 'Kaydediliyor...');
  db.ref(`products2/${id}/consumption/${k}`).set({ date, qty }).then(() => openDetail(id));
}

function addPurchase(id) {
  const date = document.getElementById('b-date').value;
  const qty = parseNum(document.getElementById('b-qty').value);
  if (!date || !qty) { alert('Tarih ve miktar gerekli.'); return; }
  const k = ref.child(id).child('purchases').push().key;
  sync('loading', 'Kaydediliyor...');
  db.ref(`products2/${id}/purchases/${k}`).set({ date, qty }).then(() => openDetail(id));
}

function deleteLog(id, k) {
  if (!confirm('Bu kayıt silinsin mi?')) return;
  db.ref(`products2/${id}/consumption/${k}`).remove().then(() => openDetail(id));
}

function deletePurchase(id, k) {
  if (!confirm('Bu alım kaydı silinsin mi?')) return;
  db.ref(`products2/${id}/purchases/${k}`).remove().then(() => openDetail(id));
}

// ── Düzenle ──────────────────────────────────────────────────
function openEdit(id) {
  const p = products[id];
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-header">
      <h2>Ürünü Düzenle</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
    <div class="form-group"><label>Ürün adı</label><input id="e-name" value="${p.name}" /></div>
    <div class="form-row">
      <div class="form-group">
        <label>Kategori</label>
        <select id="e-cat">${Object.keys(CATS).map(c=>`<option${c===p.category?' selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="form-group">
        <label>Birim</label>
        <select id="e-unit">
          <option value=""${!p.unit?' selected':''}>— birimsiz —</option>
          ${UNITS.map(u=>`<option${u===p.unit?' selected':''}>${u}</option>`).join('')}
        </select>
      </div>
    </div>
    </div>
    <div class="modal-actions" style="padding-top:0.75rem;border-top:1px solid #E8E7E2;flex-shrink:0">
      <button class="btn" onclick="openDetail('${id}')">Geri</button>
      <button class="btn primary" onclick="saveEdit('${id}')">Kaydet</button>
    </div>`;
}

function saveEdit(id) {
  const name = document.getElementById('e-name').value.trim();
  if (!name) { alert('İsim boş olamaz.'); return; }
  sync('loading', 'Kaydediliyor...');
  db.ref().update({
    [`products2/${id}/name`]: name,
    [`products2/${id}/category`]: document.getElementById('e-cat').value,
    [`products2/${id}/unit`]: document.getElementById('e-unit').value || null
  }).then(() => closeModal());
}

// ── Sil ──────────────────────────────────────────────────────
function deleteProduct(id) {
  if (!confirm('Bu ürün silinsin mi?')) return;
  sync('loading', 'Siliniyor...');
  ref.child(id).remove().then(() => closeModal());
}

let listView = false;

function toggleListView(btn) {
  listView = !listView;
  btn.textContent = listView ? '▦' : '⊞';
  btn.title = listView ? 'Grid görünüm' : 'Liste görünüm';
  const grid = document.getElementById('product-grid');
  if (grid) grid.classList.toggle('list-view', listView);
}

function switchDetailTab2(panel, el) {
  ['main','history'].forEach(p => {
    const el2 = document.getElementById('dpanel-' + p);
    if (el2) el2.classList.remove('active');
  });
  const target = document.getElementById('dpanel-' + panel);
  if (target) target.classList.add('active');
  document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function closeModal() {
  document.getElementById('modal-bg').style.display = 'none';
  document.body.style.overflow = '';
}
document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
</script>
</body>
</html>
